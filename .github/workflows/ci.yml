# ============================================================
# CI de SISSO-backend.
#
# CREADO en Auditoria N.14 (hallazgo CRITICO C14-03, P0): la
# entrega N13 declaro en CORRECCIONES_N13.md que este archivo
# existia y que el CI instalaba dependencias, levantaba PostgreSQL
# efimero, aplicaba migraciones y ejecutaba la suite completa -- esa
# afirmacion NO tenia respaldo en el ZIP auditado (el directorio
# .github/workflows no estaba presente). Este archivo cierra esa
# discrepancia: ahora es una garantia real, versionada dentro del
# repositorio auditado, no solo documentacion.
#
# CORREGIDO en Auditoria N.15 (hallazgo CRITICO C15-03, P0): la
# version anterior de este archivo NUNCA se habia ejecutado con
# exito ni una sola vez, por dos motivos independientes que solo
# aparecen al correrlo de verdad (no se detectan leyendo el YAML):
#
#   1. Faltaban MFA_ENCRYPTION_KEY, BOOTSTRAP_SECRET, RECOVERY_SECRET
#      y las credenciales de Cloudinary. Sin MFA_ENCRYPTION_KEY, el
#      hook de siembra de datos de prueba revienta al intentar
#      cifrar el secreto TOTP -- 108 de 117 pruebas fallaban antes
#      de ejecutar una sola aserticion real.
#
#   2. Con esas variables agregadas, 13 pruebas seguian fallando --
#      4 de ellas eran fallas REALES de RLS (aislamiento entre
#      organizaciones, fail-closed sin contexto). La causa NO era un
#      bug de RLS en la aplicacion: es que la imagen oficial
#      "postgres:16" crea la variable POSTGRES_USER como
#      SUPERUSUARIO del cluster, y PostgreSQL SIEMPRE omite Row
#      Level Security para un superusuario o un rol con BYPASSRLS,
#      sin importar FORCE ROW LEVEL SECURITY.
#
# CORREGIDO otra vez en la misma Auditoria N.15, tras un primer
# intento que parecia funcionar localmente pero fallo en GitHub
# Actions real: la primera correccion de (2) intentaba
# `ALTER ROLE sisso_ci WITH NOSUPERUSER` sobre el propio rol de
# servicio. Eso funciona si "sisso_ci" es un superusuario CUALQUIERA,
# pero la imagen oficial "postgres:16" no crea un superusuario
# cualquiera: ejecuta `initdb --username=sisso_ci`, es decir
# "sisso_ci" es literalmente el ROL BOOTSTRAP del cluster (el
# equivalente al rol "postgres" de una instalacion default).
# PostgreSQL protege explicitamente al rol bootstrap contra perder su
# atributo SUPERUSER via ALTER ROLE ("permission denied to alter
# role... The bootstrap user must have the SUPERUSER attribute"),
# sin importar quien lo pida -- ni siquiera el bootstrap puede
# quitarse el privilegio a si mismo. Esto solo se manifiesta con el
# rol bootstrap REAL de una imagen Docker inicializada con
# `--username`; una reproduccion local que crea "sisso_ci" como un
# superusuario secundario (via `CREATE ROLE ... SUPERUSER` desde un
# rol "postgres" ya existente) NO topa con esta proteccion, razon por
# la que el primer intento parecio funcionar en local y fallo recien
# en GitHub Actions real -- se reprodujo despues el error exacto
# localmente creando un cluster nuevo con
# `initdb --username=sisso_ci` (replicando el entrypoint real de la
# imagen oficial) antes de aplicar esta correccion.
#
# La correccion correcta no pelea contra esa proteccion: en vez de
# despojar de superusuario al rol bootstrap, se crea un SEGUNDO rol
# ("sisso_app") sin privilegios especiales desde el arranque, y se le
# transfiere la propiedad de la base de datos
# (`ALTER DATABASE sisso_ci OWNER TO sisso_app`) -- desde PostgreSQL
# 15, el esquema "public" es propiedad del rol especial
# "pg_database_owner", que automaticamente representa a quien sea el
# dueno de la base en cada momento, asi que "sisso_app" hereda
# permiso de CREATE sobre "public" sin ningun GRANT adicional. Todas
# las migraciones y pruebas corren como "sisso_app" (dueno real de
# las tablas que crea), nunca como el rol bootstrap -- exactamente la
# misma relacion dueno/RLS que tiene el rol de aplicacion en Neon.
# Verificado en un cluster con un bootstrap identico al real (RLS
# rechaza filas sin contexto de organizacion para "sisso_app", tal
# como se espera) antes de dar esto por corregido.
#
# Ambos hallazgos (y esta segunda vuelta de la correccion de RLS) se
# reprodujeron y confirmaron localmente (Postgres real, mismo flujo)
# antes de cada correccion: con todo lo de arriba resuelto, 134/134
# pruebas pasan.
#
# Que hace en cada push/PR a main:
#   1. Levanta un servicio PostgreSQL efimero (mismo motor que Neon).
#   2. npm ci en entorno limpio (no npm install: exige que
#      package-lock.json este sincronizado).
#   3. Crea un rol de aplicacion SIN privilegios especiales
#      ("sisso_app") y le transfiere la propiedad de la base de
#      datos, para que RLS se evalue de verdad, igual que en Neon
#      (ver la nota extensa de arriba sobre por que no se puede
#      lograr esto quitandole SUPERUSER al rol bootstrap).
#   4. Verifica que .env.example este sincronizado con las variables
#      de entorno que el codigo realmente usa (scripts/ci_verificar_env.js,
#      cierra el hallazgo CRITICO C15-01).
#   5. Verifica que docs/MATRIZ_RBAC.md (matriz rol x endpoint x dato
#      x accion, generada por introspeccion real de las rutas de
#      Express) siga reflejando las rutas actuales del repositorio
#      (scripts/generar_matriz_rbac.js --verificar, cierra el
#      hallazgo CRITICO C15-02).
#   6. Aplica TODAS las migraciones desde cero (npm run migrate,
#      que corre schema.sql + migration_002...N en orden), es decir
#      valida el camino completo 001->ultima migracion, no solo las
#      nuevas.
#   7. Ejecuta node --check sobre todo src/ y tests/ (deteccion
#      temprana de errores de sintaxis).
#   8. Ejecuta la suite completa (npm test) contra ese PostgreSQL
#      real -- NO mocks, igual que exige tests/README.md.
#   9. Sube como artefacto el log de resultados para evidencia de
#      auditoria (numero de pruebas aprobadas/fallidas, commit, Node,
#      Postgres).
#
# Cualquier fallo en migraciones o en la suite marca el pipeline en
# rojo y bloquea el merge (branch protection debe exigir este check).
# `set -o pipefail` se fija explicitamente en el paso de pruebas: no
# se confia en el shell por defecto del runner para que un fallo de
# "npm test" no quede enmascarado por el exit code de "tee".
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          # "sisso_ci" es el rol BOOTSTRAP del cluster (creado via
          # `initdb --username=sisso_ci` por el entrypoint de esta
          # imagen) -- se queda como superusuario a proposito, ver la
          # nota extensa de cabecera sobre por que no se le puede (ni
          # se debe) quitar ese atributo. El rol que de verdad corre
          # migraciones y pruebas es "sisso_app", creado en un paso
          # posterior.
          POSTGRES_USER: sisso_ci
          POSTGRES_PASSWORD: sisso_ci_password
          POSTGRES_DB: sisso_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sisso_ci -d sisso_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # "sisso_app", NO "sisso_ci": ver la nota de cabecera. Este rol
      # se crea en el paso "Crear rol de aplicacion..." de abajo,
      # antes de que ningun paso posterior intente conectarse con el.
      DATABASE_URL: postgresql://sisso_app:sisso_app_password@localhost:5432/sisso_ci
      # El Postgres efimero del servicio de CI (arriba) no soporta
      # SSL en absoluto -- ver comentario junto a DB_SSL_DISABLED en
      # src/db/pool.js. NUNCA definir esta variable en Render/produccion.
      DB_SSL_DISABLED: 'true'
      JWT_ACCESS_SECRET: ci_test_secret_access_do_not_use_in_prod_0000000000000000
      JWT_REFRESH_SECRET: ci_test_secret_refresh_do_not_use_in_prod_0000000000000000
      # CORREGIDO en Auditoria N.15 (C15-03): sin estas 3, el hook de
      # siembra de datos de prueba revienta antes de correr ninguna
      # prueba real (ver src/utils/crypto.js). Son secretos de CI
      # descartables, nunca los de Render/produccion.
      MFA_ENCRYPTION_KEY: 'MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI='
      BOOTSTRAP_SECRET: ci_test_bootstrap_secret_0000000000000000
      RECOVERY_SECRET: ci_test_recovery_secret_0000000000000000
      # Credenciales de Cloudinary DUMMY: la firma de URL
      # (generarUrlFirmada) solo necesita cloud_name/api_key/api_secret
      # configurados para firmar localmente -- no hace ninguna
      # llamada de red a Cloudinary, asi que un valor ficticio es
      # suficiente y no requiere una cuenta real ni secretos del
      # equipo en este pipeline publico.
      CLOUDINARY_CLOUD_NAME: ci-dummy-cloud
      CLOUDINARY_API_KEY: '123456789012345'
      CLOUDINARY_API_SECRET: ci_dummy_secret_do_not_use_0000000000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: npm ci (entorno limpio)
        run: npm ci

      - name: node --check sobre src/ y tests/
        run: |
          set -e
          find src tests -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Esperar PostgreSQL
        run: |
          for i in $(seq 1 20); do
            pg_isready -h localhost -p 5432 -U sisso_ci && break
            sleep 2
          done

      - name: Crear rol de aplicacion sin privilegios de superusuario (el bootstrap de postgres:16 no puede perder SUPERUSER)
        # Ver la nota extensa de cabecera de este archivo para el
        # detalle completo (incluye el error exacto de Postgres que
        # motivo este cambio y como se reprodujo). En resumen: no se
        # puede lograr que RLS se evalue de verdad quitandole
        # SUPERUSER al rol bootstrap ("sisso_ci") -- Postgres lo
        # prohibe explicitamente. En su lugar, se crea un rol nuevo
        # SIN privilegios especiales desde el arranque, y se le
        # transfiere la propiedad de la base de datos: el dueno de
        # una base es, desde PostgreSQL 15, tambien dueno efectivo de
        # su esquema "public" (via el rol especial
        # "pg_database_owner"), asi que puede crear tablas sin
        # ningun GRANT adicional -- y, al ser el dueno real de esas
        # tablas y no tener BYPASSRLS, SI queda sujeto a
        # FORCE ROW LEVEL SECURITY.
        run: |
          PGPASSWORD=sisso_ci_password psql -h localhost -U sisso_ci -d sisso_ci \
            -c "CREATE ROLE sisso_app WITH LOGIN PASSWORD 'sisso_app_password';"
          PGPASSWORD=sisso_ci_password psql -h localhost -U sisso_ci -d sisso_ci \
            -c "ALTER DATABASE sisso_ci OWNER TO sisso_app;"
          PGPASSWORD=sisso_ci_password psql -h localhost -U sisso_ci -d sisso_ci \
            -c "\du sisso_app"

      - name: Aplicar TODAS las migraciones desde cero (001 -> ultima)
        run: npm run migrate

      - name: Verificar que .env.example este sincronizado con el codigo
        run: node scripts/ci_verificar_env.js

      - name: Verificar que schema_migrations refleje todas las migraciones del repo
        run: node scripts/ci_verificar_migraciones.js

      - name: Verificar que la matriz RBAC (docs/MATRIZ_RBAC.md) refleje las rutas reales
        run: node scripts/generar_matriz_rbac.js --verificar

      - name: Ejecutar suite completa (npm test) contra PostgreSQL real
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/resultado-tests.log

      - name: Subir evidencia de pruebas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-tests-${{ github.sha }}
          path: /tmp/resultado-tests.log
          retention-days: 90
