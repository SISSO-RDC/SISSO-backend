:root{--bg:#F3F7FA;--surf:#fff;--ink:#152B40;--mut:#63798C;--line:#DDE6ED;--cel:#2678B8;--celbg:#E4F1FB;--sol:#E8A317;--solbg:#FDF0D5;--ok:#1C8A5C;--okbg:#E4F5EC;--bad:#C33B32;--badbg:#FBE9E7;--sh:0 1px 2px rgba(21,43,64,.06),0 1px 12px rgba(21,43,64,.05);--rad:12px;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1721;--surf:#16232F;--ink:#E9F0F6;--mut:#93A7B9;--line:#28394A;--cel:#6FB6EC;--celbg:#1B3348;--sol:#F0BB4D;--solbg:#3A2E10;--ok:#57CB98;--okbg:#123324;--bad:#F08A80;--badbg:#3A1712;--sh:0 1px 2px rgba(0,0,0,.3),0 1px 14px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0D1721;--surf:#16232F;--ink:#E9F0F6;--mut:#93A7B9;--line:#28394A;--cel:#6FB6EC;--celbg:#1B3348;--sol:#F0BB4D;--solbg:#3A2E10;--ok:#57CB98;--okbg:#123324;--bad:#F08A80;--badbg:#3A1712;--sh:0 1px 2px rgba(0,0,0,.3),0 1px 14px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(155deg,#152B40,#1E3A55);color:#fff;padding:20px 20px 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 16px rgba(0,0,0,.12)}
.brand{display:flex;align-items:baseline;gap:12px;max-width:980px;margin:0 auto}
h1{font:700 28px/1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em;color:#fff}
.brand span{color:#9FB6CB;font-size:13px;letter-spacing:.02em}
nav{display:flex;gap:2px;max-width:980px;margin:16px auto 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#9FB6CB;font:500 14.5px Figtree,sans-serif;padding:10px 14px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-color:var(--sol);font-weight:600}
main{max-width:980px;margin:0 auto;padding:26px 16px 48px}
h2{font:600 23px Fraunces,Georgia,serif;margin:0 0 16px;letter-spacing:-.01em}
h3{font:600 16.5px Fraunces,Georgia,serif;margin:18px 0 10px;color:var(--ink)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12.5px;font-weight:600;color:var(--mut);gap:5px;flex:1 1 150px;letter-spacing:.01em}
input,select,textarea{font:400 15px Figtree,inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px;width:100%;transition:border-color .15s,background .15s}
input:hover,select:hover,textarea:hover{border-color:var(--mut)}
input:focus,select:focus,textarea:focus{background:var(--surf)}
textarea{min-height:90px;resize:vertical;font-family:Figtree,inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--cel);outline-offset:2px}
.btn{background:var(--cel);color:#fff;border:0;border-radius:7px;padding:10px 18px;font:600 14.5px Figtree,sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(21,43,64,.15);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.g{background:none;color:var(--cel);border:1px solid var(--cel);box-shadow:none}
.btn.g:hover{background:var(--celbg)}
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:700;color:var(--mut);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{transition:background .12s}tbody tr:hover{background:var(--bg)}
.chip{display:inline-block;background:var(--celbg);color:var(--cel);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700;letter-spacing:.01em}
.chip.sol{background:var(--solbg);color:#8A6416}
.st-Atendido{color:var(--ok);font-weight:600}.st-Ausente,.st-Cancelado{color:var(--bad);font-weight:600}
.err{color:var(--bad);font-size:13.5px;min-height:18px;margin:10px 0 0;font-weight:600}
.empty{color:var(--mut);padding:22px 4px;text-align:center;font-size:14.5px}
.dni{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em}
.evo{border-left:3px solid var(--sol);padding:6px 0 6px 14px;margin:14px 0;font-size:14.5px}
.evo small{color:var(--mut)}
.link{background:none;border:0;color:var(--cel);cursor:pointer;font:600 inherit;padding:0;text-decoration:underline;text-underline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stats div{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:14px 16px}
.stats b{display:block;font:700 27px Fraunces,Georgia,serif;color:var(--cel)}
.stats span{color:var(--mut);font-size:12.5px;font-weight:600;letter-spacing:.01em}
footer{max-width:980px;margin:8px auto 0;padding:18px 16px 34px;color:var(--mut);font-size:12.5px;border-top:1px solid var(--line);line-height:1.6}
summary{cursor:pointer;font-weight:700;color:var(--cel);font-size:15px}
fieldset{border:1px solid var(--line);border-radius:7px;margin:0;padding:8px 12px 10px;flex:1 1 220px;min-width:0}legend{font-size:12.5px;font-weight:600;color:var(--mut);padding:0 4px}
.rad{flex-direction:row;align-items:center;gap:7px;font-size:14.5px;font-weight:400;color:var(--ink);display:flex}.rad input{width:auto}
.req{color:var(--mut);font-size:13.5px;margin:0 0 14px}
.warn{color:#8A6416;background:var(--solbg);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700}
.mut{color:var(--mut);font-size:13.5px}
a{color:var(--cel)}[hidden]{display:none!important}
nav button:last-child{margin-left:auto;color:var(--sol)}nav button.on:last-child{color:#fff}
details.card summary{margin:-2px 0 0}details.card[open] summary{margin-bottom:14px}
</style>
</head>

return `<h2>Obras sociales y prepagas</h2><div class="card"><div class="row"><label>Nombre<input id="cn"></label><label>Código RNOS (opcional)<input id="cr" placeholder="1-2570-7"></label><button class="btn" onclick="addCob()">Agregar cobertura</button></div><p class="err" id="err"></p><small class="mut">Si un seguro nuevo no figura en la base, agregalo acá.</small></div>
<div class="card"><label>Buscar por nombre, sigla o RNOS<input id="cq" value="${esc(cf)}" oninput="cf=this.value;draw();const i=$('cq');i.focus();i.setSelectionRange(99,99)"></label></div>
<div class="card"><div class="row"><label style="flex-basis:220px">Valor de consulta particular<input type="number" min="0" step="500" value="${fee()}" onchange="setFee('',this.value)"></label></div><small class="mut">Se usa cuando el paciente no tiene cobertura.</small></div>
<div class="card tw"><table><tr><th>RNOS</th><th>Entidad</th><th>Pacientes</th><th>Coseguro / valor consulta</th></tr>${l.slice(0,150).map(c=>`<tr><td class="dni">${c.r||"—"}</td><td><b>${esc(c.n)}</b>${c.s?` <small>${esc(c.s)}</small>`:""}</td><td>${S.pac.filter(p=>p.cob==c.n).length}</td><td><input type="number" min="0" step="500" style="max-width:130px" value="${fee(c.n)}" onchange="setFee('${esc(c.n).replace(/'/g,"\\'")}',this.value)"></td></tr>`).join("")}</table>${l.length>150?`<p class="mut">Mostrando 150 de ${l.length}. Usá el buscador.</p>`:""}</div>
<p class="mut">Base: ${BASE.length} obras sociales del registro de la SSSalud, indexadas por código RNOS. Prepagas y seguros nuevos se agregan a mano.</p>`}
function addCob(){const n=v("cn"),c=v("cr");if(!n)return err("Escribí el nombre de la cobertura.");if(c&&!/^\d-?\d{4}-?\d$/.test(c))return err("El RNOS debe verse así: 1-2570-7.");if(cobF(n))return err("Esa cobertura ya está en la lista.");S.cus.push({n,r:c?fr(c.replace(/-/g,"")):"",s:"Agregada"});save();draw()}
function vPor(){if(done){const p=pac(done.pid),t=S.tur.find(x=>x.id==done.tid),sug=Math.round(fee(p.cob)*.3/500)*500||5000;
return `<h2>Reserva en línea</h2><div class="card"><b>Turno reservado</b><p>${nom(p)} · ${fdate(t.f)} a las ${t.h} · ${nomPro(pro(t.prid))} · ${t.mod}${t.mod=="Telemedicina"?` · <a href="https://meet.jit.si/${esc(t.sala)}" target="_blank" rel="noopener">Sala de videoconsulta</a>`:""}</p></div>
<div class="card">${t.senaMonto?`<b>Seña pagada</b><p class="mut">${money(t.senaMonto)} vía Mercado Pago. Se descuenta del valor de la consulta.</p>`:`<h3 style="margin-top:0">Pagá una seña para confirmar el turno</h3><p class="mut">Los consultorios que piden seña reducen mucho el ausentismo. Se descuenta del valor de la consulta.</p>
<div class="row"><label style="flex-basis:160px">Monto de la seña<input id="sn_m" type="number" min="0" step="500" value="${sug}"></label><button class="btn" style="align-self:end" onclick="pagarSena(${t.id})">Pagar con Mercado Pago</button></div>
<p class="mut" style="margin-top:8px">En este prototipo el pago es simulado. Una versión real necesita el checkout de Mercado Pago con credenciales del consultorio.</p>`}</div>
<div class="card"><h3 style="margin-top:0">Cargá tus estudios previos antes de la consulta</h3><p class="mut">Ecografías, radiografías, tomografías o resonancias, aunque tengan años. El profesional los compara con los nuevos.</p>${estBlock(p.id)}
${estCount(p.id)||S.sin[p.id]?"":`<button class="btn g" style="margin-top:12px" onclick="S.sin[${p.id}]=1;save();draw()">No tengo estudios previos</button>`}</div><button class="btn" onclick="done=null;draw()">Nueva reserva</button>`}
return `<h2>Reserva en línea</h2><p class="mut">Vista del paciente. También la puede completar la secretaría.</p><div class="card"><h3 style="margin-top:0">1. Tus datos</h3>${pacFields()}</div><div class="card"><h3 style="margin-top:0">2. Tu turno</h3><div class="row">${turFields()}</div><label class="rad" style="margin-top:12px"><input type="checkbox" id="ack">Me comprometo a cargar mis estudios previos (ecografías, radiografías, tomografías, resonancias) antes de la consulta. *</label><p class="err" id="err"></p><button class="btn" onclick="reservar()">Reservar turno</button></div>`}
function reservar(){const x=readPac();if(x.e)return err(x.e);if(!$("ack").checked)return err("Confirmá que vas a cargar tus estudios previos.");const t=mkTur(x.ex?x.ex.id:x.p.id);if(!t)return;if(!x.ex){S.pac.push(x.p);save()}done={pid:t.pid,tid:t.id};draw()}
function pagarSena(tid){const t=S.tur.find(x=>x.id==tid),m=+v("sn_m")||0;t.senaMonto=m;S.pag.push({id:S.n++,tid,pid:t.pid,prid:t.prid,monto:m,forma:"Seña (Mercado Pago)",f:iso(new Date())});save();draw()}
function vCaja(){const hoy=iso(new Date()),mes=hoy.slice(0,7);
const pend=S.tur.filter(x=>x.es=="Atendido"&&!S.pag.some(g=>g.tid==x.id));
const pagM=S.pag.filter(g=>g.f.slice(0,7)==mes),totM=pagM.reduce((a,g)=>a+g.monto,0),totH=pagM.filter(g=>g.f==hoy).reduce((a,g)=>a+g.monto,0);
const porForma=FORMAS.map(fm=>[fm,pagM.filter(g=>g.forma==fm).reduce((a,g)=>a+g.monto,0)]).filter(x=>x[1]>0);
return `<div class="stats"><div><b>${money(totH)}</b><span>cobrado hoy</span></div><div><b>${money(totM)}</b><span>cobrado este mes</span></div><div><b>${pend.length}</b><span>consultas por cobrar</span></div></div>
<h2>Por cobrar</h2><div class="card tw">${pend.length?`<table><tr><th>Fecha</th><th>Paciente</th><th>Cobertura</th><th>Monto</th><th>Forma de pago</th><th></th></tr>${pend.map(x=>{const p=pac(x.pid);return `<tr><td>${fdate(x.f)}</td><td>${p?nom(p):"—"}</td><td>${p?cobChip(p):""}</td><td><input id="pm_${x.id}" type="number" min="0" step="500" style="max-width:120px" value="${Math.max(0,(p?fee(p.cob):0)-(x.senaMonto||0))}">${x.senaMonto?`<br><small class="mut">Ya pagó seña de ${money(x.senaMonto)}</small>`:""}</td><td><select id="pf_${x.id}">${FORMAS.map(f=>`<option${p&&p.cob&&f=="Cobertura (a facturar)"?" selected":""}>${f}</option>`).join("")}</select></td><td><button class="btn g" onclick="registrarPago(${x.id})">Registrar cobro</button></td></tr>`}).join("")}</table>`:'<div class="empty">No hay consultas atendidas pendientes de cobro.</div>'}</div>
${porForma.length?`<h2>Del mes por forma de pago</h2><div class="card tw"><table><tr><th>Forma de pago</th><th>Total</th></tr>${porForma.map(x=>`<tr><td>${x[0]}</td><td>${money(x[1])}</td></tr>`).join("")}</table></div>`:""}
<h2>Últimos cobros</h2><div class="card tw">${S.pag.length?`<table><tr><th>Fecha</th><th>Paciente</th><th>Forma de pago</th><th>Monto</th></tr>${[...S.pag].sort((a,b)=>a.f<b.f?1:-1).slice(0,20).map(g=>`<tr><td>${fdate(g.f)}</td><td>${nom(pac(g.pid))}</td><td>${esc(g.forma)}</td><td>${money(g.monto)}</td></tr>`).join("")}</table>`:'<div class="empty">Todavía no se registraron cobros.</div>'}</div>`}
function registrarPago(tid){const m=+v("pm_"+tid),f=document.getElementById("pf_"+tid).value,x=S.tur.find(t=>t.id==tid);
S.pag.push({id:S.n++,tid,pid:x.pid,prid:x.prid,monto:m,forma:f,f:iso(new Date())});save();draw()}
function vPerf(){const i=S.info;return `<h2>Mi consultorio</h2><p class="mut">Así te van a encontrar y reservar turno los pacientes.</p>
<details class="card" open><summary>Datos del consultorio</summary><div class="row" style="margin-top:10px">
<label style="flex-basis:260px">Nombre<input id="in_no" value="${esc(i.nombre)}"></label><label style="flex-basis:260px">Dirección<input id="in_di" value="${esc(i.dir)}"></label>
<label style="flex-basis:220px">Horario de atención<input id="in_ho" value="${esc(i.hor)}"></label><label style="flex-basis:200px">Teléfono<input id="in_te" value="${esc(i.tel)}"></label></div>
<button class="btn g" style="margin-top:10px" onclick="saveInfo()">Guardar</button></details>
<div class="card"><h3 style="margin-top:0">${esc(i.nombre)}</h3><p class="mut">${esc(i.dir)} · ${esc(i.hor)} · ${esc(i.tel)}</p>
<h3>Nuestro equipo</h3>${S.pro.length?S.pro.map(p=>`<p style="margin:6px 0"><b>${nomPro(p)}</b> — ${esc(p.esp)} <small class="mut">(${esc(matr(p))})</small></p>`).join(""):'<p class="empty">Todavía no cargaste profesionales en Equipo.</p>'}
<button class="btn" style="margin-top:14px" onclick="go('por')">Reservar turno</button></div>`}
function saveInfo(){S.info={nombre:v("in_no")||"Facultativo",dir:v("in_di"),hor:v("in_ho"),tel:v("in_te")};save();draw()}
function vEst(){const m=selMes||iso(new Date()).slice(0,7),tm=S.tur.filter(x=>x.f.slice(0,7)==m);
const tot=tm.length,aus=tm.filter(x=>x.es=="Ausente").length,pctAus=tot?Math.round(aus/tot*100):0,ing=S.pag.filter(g=>g.f.slice(0,7)==m).reduce((a,g)=>a+g.monto,0);
const porPro=S.pro.map(p=>{const t=tm.filter(x=>x.prid==p.id),a=t.filter(x=>x.es=="Ausente").length;return{p,t:t.length,a,pct:t.length?Math.round(a/t.length*100):0}});
const meses=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-(5-i));return iso(d).slice(0,7)});
const ingM=meses.map(mm=>S.pag.filter(g=>g.f.slice(0,7)==mm).reduce((a,g)=>a+g.monto,0)),max=Math.max(1,...ingM);
return `<h2>Estadísticas</h2><div class="card"><label style="flex-basis:180px">Mes<input type="month" value="${m}" onchange="selMes=this.value;draw()"></label></div>
<div class="stats"><div><b>${tot}</b><span>turnos del mes</span></div><div><b>${pctAus}%</b><span>ausentismo (${aus} de ${tot})</span></div><div><b>${money(ing)}</b><span>ingresos del mes</span></div></div>
<h2>Ausentismo por profesional</h2><div class="card tw">${porPro.length?`<table><tr><th>Profesional</th><th>Turnos</th><th>Ausentes</th><th>% ausentismo</th></tr>${porPro.map(x=>`<tr><td>${nomPro(x.p)}</td><td>${x.t}</td><td>${x.a}</td><td>${x.pct}%</td></tr>`).join("")}</table>`:'<div class="empty">Cargá profesionales en Equipo para ver este detalle.</div>'}</div>
<h2>Ingresos · últimos 6 meses</h2><div class="card">${meses.map((mm,i)=>`<div style="display:flex;align-items:center;gap:10px;margin:6px 0"><span class="mut" style="width:56px;font-size:12.5px">${mm.slice(5)}/${mm.slice(2,4)}</span><div style="flex:1;background:var(--bg);border-radius:5px;overflow:hidden"><div style="width:${ingM[i]/max*100}%;background:var(--cel);height:16px;border-radius:5px"></div></div><span style="width:110px;text-align:right;font-size:13px;font-weight:600">${money(ingM[i])}</span></div>`).join("")}</div>`}
draw();
</script>
</body>
</html>
